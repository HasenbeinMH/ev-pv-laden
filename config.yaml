# Home-Assistant-Add-on (Dockerfile im selben Ordner).
# version: muss synchron zu version.py VERSION gehalten werden (siehe dort).
#
# Hier steht nur, was zur Anlage gehoert (Sensoren, elektrische Grenzen, Auto).
# Regelparameter (Modus, Hysterese, Akku-Schwelle ...) werden zur Laufzeit in der
# Oberflaeche bzw. ueber HA-Entitaeten eingestellt und in /data gespeichert.
name: EV PV-Laden
version: "0.15.0"
slug: ev_pv_laden
description: PV-Überschussladen mit go-eCharger und Hausakku-Priorität, mit Bilanz PV/Akku/Netz für den EV Tracker.
url: "https://github.com/HasenbeinMH/ev-pv-laden"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
# Seitenleiste auch fuer Benutzer ohne Admin-Rechte (Standard waere nur Admins)
panel_admin: false
homeassistant_api: true
# Supervisor-API: nur fuer die MQTT-Zugangsdaten (GET /services/mqtt)
hassio_api: true
services:
  - mqtt:need
watchdog: "tcp://[HOST]:[PORT:8099]"
options:
  # Pflicht vor jedem Live-Betrieb: liest und rechnet, schreibt aber nichts auf die Wallbox.
  # true sperrt fest; erst bei false laesst sich der Trockenlauf in Oberflaeche/HA abschalten
  trockenlauf: true
  log_level: info
  # Messwerte (interne Konvention: Netzbezug +, Einspeisung -, Akku-Entladung +, Akku-Ladung -)
  sensor_netz: sensor.se_modbus_daten_m1_ac_power
  sensor_netz_invertieren: true
  sensor_akku_leistung: sensor.se_modbus_daten_battery1_power
  sensor_akku_leistung_invertieren: true
  sensor_akku_soc: sensor.se_modbus_daten_battery1_state_of_charge
  sensor_pv: sensor.nodered_338b35fcb1bd7ed8_2
  # Hausverbrauch fuer die Anzeige (optional); enthaelt er die Wallbox, zieht das Add-on sie ab
  sensor_haus: sensor.nodered_1c07e9ce6774f5ec
  sensor_haus_enthaelt_auto: true
  # Schreibt das Messgeraet nur bei Wertaenderung (SolarEdge-Akku), zeigt dieser Sensor,
  # dass die Abfrage noch laeuft (Lebensbit des ganzen Geraets)
  sensor_lebenszeichen: sensor.se_modbus_daten_m1_ac_power
  max_alter_s: 15
  # go-eCharger (Integration goecharger_api2): Seriennummer aus den Entity-IDs goe_XXXXXX_...
  goe_seriennummer: "325656"
  # Treiber ids: echte PV-Leistung als pPv mitsenden (sonst 0)
  ids_ppv_senden: true
  # Elektrische Grenzen – werden nie ueberschritten
  max_strom_a: 24
  max_strom_1ph_a: 20
  ev_max_strom_1ph_a: 16
  min_strom_a: 6
  # Auto
  akku_kapazitaet_kwh: 58.3
  ladewirkungsgrad: 0.9
  # Hoechste AC-Ladeleistung des Autos; die Zielzeit plant mit min(Auto, Wallbox-Grenze)
  ev_max_leistung_kw: 22
  # SoC des Autos aus HA (optional); ohne Sensor wird er in der Oberflaeche eingetragen
  sensor_auto_soc: ""
  # EV Tracker (optional): Adresse und Token aus EV Tracker -> Einstellungen
  ev_tracker_url: ""
  ev_tracker_token: ""
  # Fahrzeug im EV Tracker (Nummer oder Name); leer = Hauptfahrzeug
  ev_tracker_fahrzeug: ""
  akku_als_netz: false
  # PV-Prognose (eigenes Modell, lernt aus der HA-Statistik): Dachflaechen
  # azimut: 0 = Nord, 90 = Ost, 180 = Sued, 270 = West; kwp: Leistung der Flaeche
  pv_flaechen:
    - name: Süd
      neigung: 6
      azimut: 179
      kwp: 3.33
    - name: Nord
      neigung: 14
      azimut: 359
      kwp: 3.33
    - name: Ost
      neigung: 34
      azimut: 86
      kwp: 3.33
  # Gemessene PV-Erzeugung: Energiezaehler (kWh) ODER SolarEdge-Hybrid (DC + Akku)
  sensor_pv_energie: ""
  sensor_pv_dc_leistung: sensor.se_modbus_daten_dc_power
  sensor_akku_geladen: sensor.se_modbus_daten_battery1_charged
  sensor_akku_entladen: sensor.se_modbus_daten_battery1_discharged
schema:
  trockenlauf: bool
  log_level: list(debug|info|warning|error)
  sensor_netz: match(^sensor\.[a-z0-9_]+$)
  sensor_netz_invertieren: bool
  sensor_akku_leistung: match(^(sensor\.[a-z0-9_]+)?$)
  sensor_akku_leistung_invertieren: bool
  sensor_akku_soc: match(^(sensor\.[a-z0-9_]+)?$)
  sensor_pv: match(^(sensor\.[a-z0-9_]+)?$)
  sensor_haus: match(^(sensor\.[a-z0-9_]+)?$)
  sensor_haus_enthaelt_auto: bool
  sensor_lebenszeichen: match(^(sensor\.[a-z0-9_]+)?$)
  max_alter_s: int(5,300)
  goe_seriennummer: match(^[0-9]+$)
  ids_ppv_senden: bool
  # Obergrenzen bewusst im Schema begrenzt: 24 A Zuleitung, 20 A Schieflast (VDE-AR-N 4100)
  max_strom_a: int(6,24)
  max_strom_1ph_a: int(6,20)
  ev_max_strom_1ph_a: int(6,32)
  min_strom_a: int(6,16)
  akku_kapazitaet_kwh: float(10,200)
  ev_max_leistung_kw: float(1,350)
  sensor_auto_soc: match(^(sensor\.[a-z0-9_]+)?$)
  ladewirkungsgrad: float(0.5,1)
  ev_tracker_url: str
  ev_tracker_token: password
  ev_tracker_fahrzeug: str
  akku_als_netz: bool
  pv_flaechen:
    - name: str
      neigung: float(0,90)
      azimut: float(0,360)
      kwp: float(0.05,100)
  sensor_pv_energie: match(^(sensor\.[a-z0-9_]+)?$)
  sensor_pv_dc_leistung: match(^(sensor\.[a-z0-9_]+)?$)
  sensor_akku_geladen: match(^(sensor\.[a-z0-9_]+)?$)
  sensor_akku_entladen: match(^(sensor\.[a-z0-9_]+)?$)
